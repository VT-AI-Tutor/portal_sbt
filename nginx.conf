# The SPA entrypoint names the current hashed Vite bundle. Never cache it,
# otherwise a browser can keep an old index.html and continue loading a
# bundle from a previous deployment after the app container is replaced.
# An empty value makes nginx omit the header for every other path.
map $uri $index_cache_control {
    /index.html "no-cache, no-store, must-revalidate";
    default     "";
}

server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Every add_header lives at server level: nginx drops all inherited
    # add_header directives in a location that declares its own, and every SPA
    # route (including `/`) is served through `location = /index.html`.
    add_header Cache-Control $index_cache_control always;

    # Security headers
    # Enforce HTTPS for 1 year — header is forwarded by the upstream TLS-terminating proxy
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    # TODO: remove 'unsafe-inline' from script-src and style-src once the app uses
    # nonces or hashes. See: https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https: blob: data:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https:; frame-ancestors 'none';" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; media-src 'self' https: blob: data:; font-src 'self' data:; connect-src 'self' http: https:; frame-src 'self' https:; frame-ancestors *;" always;

    # Vite emits the PDF.js worker as .mjs; default nginx mime.types omits it.
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
